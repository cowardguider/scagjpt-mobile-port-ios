name: Build unsigned iOS IPA
on:
  workflow_dispatch:
env:
  GODOT_VERSION: "4.7.1-stable"
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project zips
        run: |
          for z in scag_part*.zip; do unzip -q -o "$z"; done
          ls
      - name: Enable log access
        run: |
          sed -i '' 's/accessible_from_files_app=false/accessible_from_files_app=true/' export_presets.cfg
          sed -i '' 's/accessible_from_itunes_sharing=false/accessible_from_itunes_sharing=true/' export_presets.cfg
          grep accessible export_presets.cfg
      - name: Register debug overlay
        run: |
          perl -0pi -e 's|\[autoload\]\n|[autoload]\nIosDebug="*res://ios_debug.gd"\n|' project.godot
          grep -n IosDebug project.godot
      - name: Patch renderer restart for iOS
        run: |
          perl -0pi -e 's/(func rendering_method_callback\([^\n]*\n)/$1\tif OS.has_feature("ios"):\n\t\treturn\n/' code/autoloads/data/game_settings.gd
          grep -n -A3 "func rendering_method_callback" code/autoloads/data/game_settings.gd
      - name: Patch iOS input, drag, roaming, animations and dialogue
        run: |
          python3 - <<'PYEOF'
          def patch(path, old, new, count=1):
              s = open(path, encoding="utf-8").read()
              if old not in s:
                  print("NOT FOUND:", path, old[:40])
                  return
              open(path, "w", encoding="utf-8").write(s.replace(old, new, count))
              print("patched:", path)
          patch("code/autoloads/util.gd",
              'func get_mouse_position() -> Vector2i:\n\treturn DisplayServer',
              'func get_mouse_position() -> Vector2i:\n\tif OS.has_feature("ios"):\n\t\treturn Vector2i(get_viewport().get_mouse_position())\n\treturn DisplayServer')
          patch("code/autoloads/util.gd",
              'func get_current_screen() -> int:',
              'func ios_scale() -> Vector2:\n\tif OS.has_feature("ios"):\n\t\treturn Vector2(DisplayServer.window_get_size(0)) / get_viewport().get_visible_rect().size\n\treturn Vector2.ONE\n\n\nfunc get_global_mouse() -> Vector2i:\n\tif OS.has_feature("ios"):\n\t\treturn Vector2i(get_viewport().get_mouse_position() * ios_scale())\n\treturn DisplayServer.mouse_get_position()\n\n\nfunc get_current_screen() -> int:')
          patch("objects/character/character_worker.gd",
              'const TIME_LIMIT_TO_POKE: float = 0.15',
              'const TIME_LIMIT_TO_POKE: float = 0.35')
          patch("objects/character/character_worker.gd",
              '\tGlobals.character = self\n',
              '\tGlobals.character = self\n\tif OS.has_feature("ios"):\n\t\troaming_enabled = true\n')
          patch("objects/character/character_worker.gd",
              'DisplayServer.mouse_get_position()',
              'Util.get_global_mouse()', -1)
          patch("objects/character/character_worker.gd",
              '_drag_lerp = - Util.get_mouse_position()',
              '_drag_lerp = - Vector2(Util.get_mouse_position()) * Util.ios_scale()')
          patch("objects/character/character_worker.gd",
              'unproject_position(rig.grab_position.global_position)\n',
              'unproject_position(rig.grab_position.global_position) * Util.ios_scale()\n')
          patch("objects/character/character_worker.gd",
              '\t\tScreenBounds.set_position_raw(mouse_pos + Vector2i(_drag_lerp))\n',
              '\t\tvar drag_target = mouse_pos + Vector2i(_drag_lerp)\n\t\tif OS.has_feature("ios"):\n\t\t\tvar ws = DisplayServer.window_get_size(0)\n\t\t\tdrag_target = Vector2i(clampi(drag_target.x, -ws.x / 2 + 240, ws.x / 2 - 240), clampi(drag_target.y, -ws.y / 2 + 420, ws.y / 2 - 420))\n\t\tScreenBounds.set_position_raw(drag_target)\n')
          patch("objects/character/character_worker.gd",
              'if _mouse_velocity.length() > 4:',
              'if _mouse_velocity.length() > 4 and not OS.has_feature("ios"):')
          patch("objects/character/character_worker.gd",
              '\t\t\t\tif Input.is_action_pressed("hold"):\n\t\t\t\t\t_last_click += delta',
              '\t\t\t\tif Input.is_action_pressed("hold") and _ios_hit():\n\t\t\t\t\t_last_click += delta')
          patch("objects/character/character_worker.gd",
              'if _last_click < TIME_LIMIT_TO_POKE and Globals.poke_enabled.get_prioritized_value() and _can_click == 0:',
              'if (_last_click > 0.0 or not OS.has_feature("ios")) and _last_click < TIME_LIMIT_TO_POKE and Globals.poke_enabled.get_prioritized_value() and _can_click == 0:')
          patch("objects/character/character_worker.gd",
              'func _process_after_anim():',
              'func _ios_hit() -> bool:\n\tif not OS.has_feature("ios"):\n\t\treturn true\n\tvar cam = get_viewport().get_camera_3d()\n\tif cam == null:\n\t\treturn true\n\tvar bb = rig.global_transform * rig.get_bounding_box()\n\tvar rect = Rect2(cam.unproject_position(bb.get_endpoint(0)), Vector2.ZERO)\n\tfor i in range(1, 8):\n\t\trect = rect.expand(cam.unproject_position(bb.get_endpoint(i)))\n\treturn rect.grow(60.0).has_point(Vector2(get_viewport().get_mouse_position()))\n\n\nfunc _process_after_anim():')
          patch("code/autoloads/screen_bounds.gd",
              '\n\tget_window().size = value\n',
              '\n\tif not OS.has_feature("ios"):\n\t\tget_window().size = value\n')
          patch("objects/character/camera_follower.gd",
              '\tGlobals.camera = self\n',
              '\tGlobals.camera = self\n\tif OS.has_feature("ios"):\n\t\tkeep_aspect = Camera3D.KEEP_WIDTH\n\t\tfov = 19.8\n')
          patch("objects/character/camera_follower.gd",
              'var window_size = DisplayServer.window_get_size(0)',
              'var window_size = Vector2i(get_viewport().get_visible_rect().size) if OS.has_feature("ios") else DisplayServer.window_get_size(0)')
          patch("objects/character/camera_follower.gd",
              'var diff: Vector2i = ScreenBounds.target_window_position - DisplayServer.window_get_position()',
              'var diff: Vector2i = Vector2i.ZERO if OS.has_feature("ios") else ScreenBounds.target_window_position - DisplayServer.window_get_position()')
          patch("objects/character/camera_follower.gd",
              '\telse:\n\t\treset()',
              '\telse:\n\t\treset()\n\tif OS.has_feature("ios") and not Globals.character.state in [CharacterWorker.States.MENU_MODE, CharacterWorker.States.RAGDOLLED]:\n\t\tvar vp = get_viewport().get_visible_rect().size\n\t\tvar d = absf(position.z - Globals.character.global_position.z)\n\t\tvar per_px = 2.0 * d * tan(deg_to_rad(fov) / 2.0) / vp.x\n\t\tvar off = Vector2(ScreenBounds.target_window_position) * vp / Vector2(DisplayServer.window_get_size(0))\n\t\tposition.x -= off.x * per_px\n\t\tposition.y += off.y * per_px')
          patch("objects/character/roaming_controller.gd",
              'func get_random_roam_position(target_screen: int = Util.get_current_screen()) -> Vector2i:\n',
              'func get_random_roam_position(target_screen: int = Util.get_current_screen()) -> Vector2i:\n\tif OS.has_feature("ios"):\n\t\tvar ws = DisplayServer.window_get_size(0)\n\t\treturn Vector2i(randi_range(-ws.x / 2 + 300, ws.x / 2 - 300), randi_range(-ws.y / 2 + 460, ws.y / 2 - 460))\n')
          patch("objects/character/tutorial.gd",
              '\treturn UserConfig.get_value("game", "completed_tutorial", false)',
              '\tif OS.has_feature("ios"):\n\t\treturn true\n\treturn UserConfig.get_value("game", "completed_tutorial", false)')
          patch("scenes/rigs/rig.gd",
              '\tskeleton = rig.get_child(0).get_node("Skeleton3D")\n',
              '\tskeleton = rig.get_child(0).get_node("Skeleton3D")\n\t_fix_animation_paths()\n')
          patch("scenes/rigs/rig.gd",
              'func set_animation_state(state: AnimationStates) -> void :',
              'func _fix_animation_paths() -> void:\n\tif animator == null or skeleton == null:\n\t\treturn\n\tvar root_node = animator.get_node_or_null(animator.root_node)\n\tif root_node == null:\n\t\treturn\n\tvar skel_path = str(root_node.get_path_to(skeleton))\n\tvar count = 0\n\tfor lib_name in animator.get_animation_library_list():\n\t\tvar lib = animator.get_animation_library(lib_name)\n\t\tfor anim_name in lib.get_animation_list():\n\t\t\tvar anim = lib.get_animation(anim_name)\n\t\t\tfor i in range(anim.get_track_count()):\n\t\t\t\tvar t = anim.track_get_type(i)\n\t\t\t\tif t == Animation.TYPE_POSITION_3D or t == Animation.TYPE_ROTATION_3D or t == Animation.TYPE_SCALE_3D:\n\t\t\t\t\tvar bone = anim.track_get_path(i).get_concatenated_subnames()\n\t\t\t\t\tif bone != "" and skeleton.find_bone(bone) >= 0:\n\t\t\t\t\t\tanim.track_set_path(i, NodePath(skel_path + ":" + bone))\n\t\t\t\t\t\tcount += 1\n\tanimation_tree.clear_caches()\n\tprinterr("[ANIMFIX] retargeted tracks: ", count, " path: ", skel_path)\n\n\nfunc set_animation_state(state: AnimationStates) -> void :')
          patch("interface/dialogue/dialogue.gd",
              '\tif target_window:\n\t\tvar screen_position: Vector2i = DisplayServer.window_get_position(target_window.get_window_id())',
              '\tif OS.has_feature("ios"):\n\t\t_ios_position(delta)\n\t\treturn\n\tif target_window:\n\t\tvar screen_position: Vector2i = DisplayServer.window_get_position(target_window.get_window_id())')
          patch("interface/dialogue/dialogue.gd",
              'func _process(delta: float) -> void :',
              'func _ios_position(delta: float) -> void:\n\tvar vp = Vector2(get_tree().root.get_visible_rect().size)\n\tvar ws = Vector2(get_contents_minimum_size())\n\tvar target = Vector2.ZERO\n\tis_going_downward = false\n\tif target_window:\n\t\tvar tp = Vector2(target_window.position)\n\t\tvar ts = Vector2(target_window.get_contents_minimum_size())\n\t\ttarget = tp + Vector2(ts.x / 2.0 - ws.x / 2.0, -10.0 - ws.y)\n\t\tif target_window.is_going_downward or target.y < 0.0:\n\t\t\tis_going_downward = true\n\t\t\ttarget = tp + Vector2(ts.x / 2.0 - ws.x / 2.0, ts.y + 10.0)\n\telif Globals.character:\n\t\tvar bb = Globals.character.rig.global_transform * Globals.character.rig.get_bounding_box()\n\t\tvar top = bb.get_center() + Vector3(0, bb.size.y + DIALOGUE_OFFSET, 0) / 2\n\t\ttarget = Globals.camera.unproject_position(top) - Vector2(ws.x / 2.0, ws.y)\n\t\tif target.y < 0.0:\n\t\t\tvar bottom = bb.get_center() + Vector3(0, -bb.size.y - BOTTOM_DIALOGUE_OFFSET, 0) / 2\n\t\t\ttarget = Globals.camera.unproject_position(bottom) - Vector2(ws.x / 2.0, 0.0)\n\t\t\tis_going_downward = true\n\ttarget.x = clampf(target.x, 0.0, maxf(vp.x - ws.x, 0.0))\n\ttarget.y = clampf(target.y, 0.0, maxf(vp.y - ws.y, 0.0))\n\tposition = Vector2i(Vector2(position).lerp(target, minf(delta * 10.0, 1.0)))\n\n\nfunc _process(delta: float) -> void :')
          PYEOF
      - name: Install Godot + export templates
        run: |
          V="${GODOT_VERSION}"
          BASE="https://github.com/godotengine/godot-builds/releases/download/${V}"
          curl -L -o godot.zip "${BASE}/Godot_v${V}_macos.universal.zip"
          curl -L -o templates.tpz "${BASE}/Godot_v${V}_export_templates.tpz"
          unzip -q godot.zip
          T="$HOME/Library/Application Support/Godot/export_templates/${V/-/.}"
          mkdir -p "$T" && unzip -q templates.tpz -d tpl && cp -R tpl/templates/* "$T/"
      - name: Import + export Xcode project
        run: |
          GODOT="./Godot.app/Contents/MacOS/Godot"
          $GODOT --headless --import || true
          mkdir -p build/ios
          $GODOT --headless --export-release "iOS" build/ios/scag.xcodeproj
      - name: Build unsigned .app and package IPA
        run: |
          cd build/ios
          xcodebuild -project scag.xcodeproj -scheme scag -configuration Release \
            -sdk iphoneos -arch arm64 -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir Payload && cp -R dd/Build/Products/Release-iphoneos/*.app Payload/
          zip -qry ../../scag-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: scag-unsigned-ipa
          path: scag-unsigned.ipa
